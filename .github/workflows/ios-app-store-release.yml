name: iOS App Store Release

# App Store release: uploads metadata for an existing build.
# Defaults are conservative: no AI copy, the App Store description is never
# overwritten, and nothing is submitted for review unless explicitly requested.
# Uses shared workflow from ios-infra

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      build_number:
        description: 'Build number to release (from TestFlight)'
        required: true
        type: string
      generate_screenshots:
        description: 'Generate new screenshots'
        required: false
        default: true
        type: boolean
      generate_description:
        description: 'AI-generate a description draft (only uploaded if upload_description is also set)'
        required: false
        default: false
        type: boolean
      upload_description:
        description: 'Upload fastlane description.txt (OVERWRITES the App Store description)'
        required: false
        default: false
        type: boolean
      generate_release_notes:
        description: 'Generate release notes with AI (from commits since last release)'
        required: false
        default: false
        type: boolean
      submit_for_review:
        description: 'Submit to App Store review'
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-app-store-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: wdvr/ios-infra/.github/workflows/ios-app-store-release.yml@main
    with:
      bundle_id: com.wouterdevriendt.footprint
      scheme: Footprint
      app_version: ${{ github.event.inputs.app_version }}
      build_number: ${{ github.event.inputs.build_number }}
      app_name: Footprint
      app_context: 'A travel tracking app for marking visited countries, US states, and Canadian provinces on an interactive world map. Track your travels and see statistics about your adventures.'
      generate_screenshots: ${{ github.event.inputs.generate_screenshots }}
      generate_description: ${{ github.event.inputs.generate_description }}
      upload_description: ${{ github.event.inputs.upload_description }}
      generate_release_notes: ${{ github.event.inputs.generate_release_notes }}
      submit_for_review: ${{ github.event.inputs.submit_for_review }}
      use_xcodegen: true
      xcodegen_path: ios
      project_path: ios/Footprint.xcodeproj
    secrets: inherit
